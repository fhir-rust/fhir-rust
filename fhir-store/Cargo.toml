[package]
name = "fhir-store"
version = "0.3.2"
edition = "2024"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
description = "The engine-agnostic half of FHIR® persistence: tamper-evident audit chain, attribution records, and the value types every SQL port returns. HL7®, and FHIR® are the registered trademarks of Health Level Seven International and their use of these trademarks does not constitute an endorsement by HL7. This project is an independent work."
readme = "README.md"
repository = "https://github.com/fhir-rust/fhir-rust/"
keywords = ["fhir", "healthcare", "hl7", "audit", "medical"]
categories = ["database", "science", "data-structures"]
# `RV1.4` was unmet here until 2026-08-29: the six ports promised 1.90 and CI
# built on exactly that toolchain, but this crate's own floor had never been
# measured, and agents/release.md is explicit that an unverified MSRV is a
# guess. Measured against 1.96 (the current RV1.1 ceiling, spec
# spec/rust-msrv-n-minus-2/) with `cargo +1.96 check --all-targets --locked`
# before being written down, per RV1.5.
rust-version = "1.96"

[dependencies]
serde = { version = "1", features = ["derive"] }
# `arbitrary_precision` is not a preference: FHIR `decimal` must keep the
# precision it was written with (M3.6), and without it serde_json turns 9.60
# into 9.6. `float_roundtrip` covers the other direction — an `f64` that does
# reach the parser is parsed exactly, so f64 -> JSON -> f64 is the value it
# started as rather than the nearest short form. `preserve_order` keeps object
# key order stable, which the canonical form the chain commits to depends on.
# See spec/serde-json-float-roundtrip-arbitrary-precision/.
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "preserve_order"] }
thiserror = "2"
# The chain is SHA-256 + SHA3-256 with an optional HMAC (M3.16).
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
getrandom = "0.3"
