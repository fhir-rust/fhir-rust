# Supply-chain policy (spec O10.10).
#
# fhir-sqlite stores patient data, so its dependency set is evidence someone will
# be asked to produce. Keeping this green continuously is far cheaper than
# reconstructing it during an audit.

[advisories]
# Any unpatched advisory fails the build. When one has no fix yet, add it
# here with a dated note rather than lowering the bar globally.
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0194, -0195 — two denial-of-service defects in quick-xml
    # 0.39.4: quadratic run time checking a start tag for duplicate attribute
    # names, and unbounded namespace-declaration allocation in `NsReader`.
    #
    #   quick-xml 0.39.4
    #     <- opendal-core 0.57.0   (a hard dependency, not a service feature)
    #        <- opendal 0.57.0
    #           <- loco-rs 1.0.1
    #              <- fhir-store
    #
    # NOT reachable through a feature knob: quick-xml is unconditional in
    # opendal-core, so it cannot be turned off from here.
    #
    # Blocked upstream, and precisely so. The fix is quick-xml >= 0.41.0;
    # opendal-core 0.58.0 requires exactly that, and loco-rs 1.0.1 pins
    # `opendal ^0.57`. One loco release that allows opendal 0.58 clears both.
    # Verified 2026-08-02 against the crates.io index.
    #
    # Exposure, stated with its limit. These fire on parsing hostile XML.
    # This service parses FHIR **JSON**, and loco enables only opendal's
    # `services-fs` and `services-memory` backends — not `services-s3`,
    # `-azblob` or `-gcs`, whose responses are the XML opendal parses. So
    # nothing here is known to feed XML to quick-xml. That is a feature-level
    # argument, not an audit of opendal's source: it has NOT been proven that
    # no code path under fs/memory reaches the parser.
    #
    # Re-check on every loco-rs release. Remove this entry, do not extend it.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
# Permissive licences only. Anything copyleft in a linked dependency would
# change the licensing of a deployment we do not control.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # Both reached only through the web framework, and both permissive:
    #   0BSD                  quoted_printable — BSD Zero Clause, no conditions
    #   CDLA-Permissive-2.0   webpki-roots — a *data* licence for the root
    #                         certificate set, not the code around it
    # Neither is copyleft, so neither can change the licensing of a deployment,
    # which is what this allowlist exists to prevent.
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions are allowed but visible: they are how a
# vulnerable transitive copy survives an upgrade of its sibling.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
