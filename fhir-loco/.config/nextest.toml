# cargo-nextest configuration for the fhir-loco workspace. Opt-in and local: CI keeps
# using `cargo test`. Run `cargo nextest run` from this directory; nextest does
# not run doctests, so also run `cargo test --doc`.

[profile.default]
# Report every failure, never stop at the first.
fail-fast = false
# Retries stay off: a retry hides a flaky test. Do not enable them here.
retries = 0
status-level = "pass"
final-status-level = "fail"
# Flag a test after 60s and kill it after 10 periods (10 minutes).
slow-timeout = { period = "60s", terminate-after = 10 }
# No default-filter: every test runs, nextest must not silently skip coverage.
# The request suite (tests/requests/*) is slow under nextest, ~17 minutes against
# ~25s under `cargo test`, because it must be serial (see test-groups below) and
# every test process wipes and rebuilds the scratch database (~30-60s each under
# load). For quick local runs of this crate prefer `cargo test`.
# requests::home::can_get_home is order-independent (commit 22ba5e5), so it also
# passes when run alone.

[profile.ci]
retries = 0
fail-fast = false
status-level = "fail"
final-status-level = "fail"
slow-timeout = { period = "60s", terminate-after = 10 }

# fhir-loco's request suite shares a process-global store and wipes and
# rebuilds target/test-scratch/ in every process, so its tests must not run
# concurrently with one another.
[test-groups]
loco-scratch = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(fhir-loco)'
test-group = "loco-scratch"
