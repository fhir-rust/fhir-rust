# Supply-chain policy (spec O10.10).
#
# fhir-mssql stores patient data, so its dependency set is evidence someone will
# be asked to produce. Keeping this green continuously is far cheaper than
# reconstructing it during an audit.

[advisories]
# Any unpatched advisory fails the build. When one has no fix yet, add it
# here with a dated note rather than lowering the bar globally.
yanked = "deny"
# **F-67, closed 2026-08-29 — no ignores below, and there is a reason to say
# so rather than just deleting silently.** From 2026-08-02 to 2026-08-28 this
# section carried four ignored advisories — RUSTSEC-2025-0134
# (rustls-pemfile, unmaintained) and RUSTSEC-2026-0098/-0099/-0104
# (rustls-webpki 0.101.7, X.509 name-constraint and CRL-parsing defects, the
# last a reachable panic) — all four reaching this crate through one chain:
#
#   rustls-webpki 0.101.7 / rustls-pemfile 1.0.4
#     <- rustls-native-certs 0.6.3 / rustls 0.21.12
#        <- tokio-rustls 0.24.1
#           <- tiberius 0.12.3
#              <- fhir-mssql-store   <-- NORMAL dependency, not dev
#
# `tiberius` 0.12.3 was, and remains, its last release. The 2026-08-28 owner
# decision (recorded at length in git history for this file) was to accept
# the risk formally rather than keep shipping it silently, after pricing
# three alternatives and setting each aside: a from-scratch driver
# (~3-4.5 months), the one fork that already carried a fix upstream
# (`prisma/tiberius#419` — CI-green but zero maintainer review in 3+ months,
# and unusable by a published crate since cargo forbids a `git` dependency
# in one), and `ms-tds` (disqualified on sight — its own description
# advertises offensive/exploitation tooling).
#
# What changed 2026-08-29: the owner published `mssql`
# (github.com/joelparkerhenderson/mssql-rust), a fork of tiberius maintained
# specifically to carry security fixes tiberius itself stopped shipping —
# which is exactly the `#419`-style fix the investigation above found and
# set aside for lack of review, minus the review problem, since it is now
# this project's own crate rather than someone else's unreviewed branch.
# Switching `Cargo.toml`'s dependency from `tiberius` to `mssql` (aliased
# `mssql-driver` — see that file's comment) resolves `tokio-rustls 0.26` /
# `rustls 0.23` / `rustls-webpki 0.103.15`. None of the four advisory
# packages appear anywhere in this workspace's tree any longer, confirmed
# with `cargo tree` before this comment was written. Nothing to ignore.
ignore = []

[licenses]
# Permissive licences only. Anything copyleft in a linked dependency would
# change the licensing of a deployment we do not control.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions are allowed but visible: they are how a
# vulnerable transitive copy survives an upgrade of its sibling.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
