# Supply-chain policy (spec O10.10).
#
# fhir-mssql stores patient data, so its dependency set is evidence someone will
# be asked to produce. Keeping this green continuously is far cheaper than
# reconstructing it during an audit.

[advisories]
# Any unpatched advisory fails the build. When one has no fix yet, add it
# here with a dated note rather than lowering the bar globally.
yanked = "deny"
ignore = [
    # RUSTSEC-2025-0134 — rustls-pemfile is unmaintained (repository archived
    # August 2025). Not a vulnerability; an unmaintained-crate advisory.
    #
    #   rustls-pemfile 1.0.4
    #     <- rustls-native-certs 0.6.3
    #        <- tiberius 0.12.3
    #           <- fhir-mssql-store   <-- NORMAL dependency, not dev
    #
    # **Correction, 2026-08-04: this entry's original reasoning was wrong as
    # soon as the store existed, and nobody updated it.** It used to say
    # "verified absent from `cargo tree -e normal`... nothing that ships is
    # affected" — true in 2026-08-02, when tiberius was only a dev-dependency
    # of the DDL test. `fhir-mssql-store` (a published, shipping crate) now
    # depends on it directly, confirmed by running `cargo tree -p
    # fhir-mssql-store -e normal` and seeing this chain in the normal tree.
    # This advisory now reaches every consumer of the published store crate.
    #
    # Still ignored, not because the exposure is small but because there is
    # no fix: `native-tls` was tried as an escape from the whole rustls chain
    # (2026-08-04) and rejected — it fails the TLS handshake outright against
    # this server's certificate on this host ("Error forming TLS connection:
    # connection closed via error"), including with blind trust, so it is not
    # a viable substitute here, only elsewhere. 0.12.3 is tiberius's newest
    # release (confirmed against the crates.io index the same day) and it
    # pins `rustls-native-certs 0.6`. RUSTSEC says of rustls-pemfile itself
    # "No safe upgrade is available". See `M14.34` for the full account and
    # the options that remain: a different driver, or accepting this as a
    # standing residual risk pending one.
    "RUSTSEC-2025-0134",

    # RUSTSEC-2026-0098, -0099, -0104 — three rustls-webpki 0.101.7 defects in
    # X.509 name-constraint handling and CRL parsing (the last a reachable
    # panic). Same now-normal chain, one layer deeper:
    #
    #   rustls-webpki 0.101.7
    #     <- rustls 0.21.12
    #        <- tokio-rustls 0.24.1
    #           <- tiberius 0.12.3
    #              <- fhir-mssql-store   <-- NORMAL dependency, not dev
    #
    # **Same correction as above, and sharper here**: `rustls-webpki` is the
    # crate that performs the certificate validation `tests/ssl_live.rs`
    # proves this store actually relies on for `O10.7` — the exact code path
    # with three unpatched defects is the one now confirmed load-bearing for
    # every TLS connection this store makes, in a crate that ships. The fixes
    # are in `rustls-webpki >= 0.103.12`, which needs `rustls 0.23`; `rustls
    # 0.21.12` pins `^0.101`, so `cargo update -p rustls-webpki` changes
    # nothing — verified. `native-tls` does not work on this host (above), so
    # it is not an escape from this one either. Recorded 2026-08-02, corrected
    # 2026-08-04; see `M14.34` — this now needs an owner decision, not another
    # renewal of this comment.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]

[licenses]
# Permissive licences only. Anything copyleft in a linked dependency would
# change the licensing of a deployment we do not control.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions are allowed but visible: they are how a
# vulnerable transitive copy survives an upgrade of its sibling.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
