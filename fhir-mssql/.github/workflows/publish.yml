name: Publish to crates.io

# Manual only, and deliberately so. A crates.io version is immutable: it can
# be yanked but never replaced or removed, so publishing is not something a
# tag push should do as a side effect. The `confirm` input has to be typed
# out, which is the point.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm. This cannot be undone.'
        required: true
        type: string
      dry_run:
        description: "Verify packaging without uploading"
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'publish'
        run: |
          echo "::error::confirm input was '${{ inputs.confirm }}', expected 'publish'"
          exit 1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Publish never uploads something that has not passed the same gates as
      # a normal build. A broken release of a clinical component is expensive
      # to withdraw and impossible to un-download.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      # Dependency order: each crate must exist on the registry before the
      # one that depends on it can be verified. `cargo publish` waits for the
      # index itself, but a fresh version can still take a moment to appear.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY" != "true" ] && [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set for this environment"
            exit 1
          fi
          for crate in fhir-mssql-map fhir-mssql-gen fhir-mssql-store fhir-mssql-server fhir-mssql; do
            echo "::group::$crate"
            if [ "$DRY" = "true" ]; then
              # --dry-run cannot resolve sibling crates that are not on the
              # registry yet, so a first-time release reports failures here
              # that a real publish would not hit. Package instead, which
              # checks the manifest and the file list without resolving.
              cargo package -p "$crate" --locked --allow-dirty
            else
              cargo publish -p "$crate" --locked
            fi
            echo "::endgroup::"
          done
