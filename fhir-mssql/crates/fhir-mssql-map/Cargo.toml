[package]
name = "fhir-mssql-map"
description = "Relational map and shred/reconstruct engine for fhir-mssql (T-SQL DDL, live-verified against SQL Server - audit.md F-65). HL7®, and FHIR® are the registered trademarks of Health Level Seven International and their use of these trademarks does not constitute an endorsement by HL7. This project is an independent work."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Which FHIR versions' maps are compiled in (F-33). Each is 0.5-1.2 MB in the
# binary and most callers want one, so they are opt-in — the same shape the
# model family uses for its release crates. `r5` is on by default.
#
# These gate compilation, not download: a .crate archive is static, so all
# three maps ship with it regardless.
default = ["r5"]
r3 = []
r4 = []
r5 = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
flate2.workspace = true
unicode-normalization.workspace = true
# U4: the checksum adjunct is computed here, never by a SQL function.
sha2.workspace = true

[dev-dependencies]
mssql-driver.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
