[package]
name = "fhir-mssql-store"
description = "SQL Server storage layer for fhir-mssql (Store level: live-verified against azure-sql-edge, 33/33 tests - audit.md F-65; TLS advisory risk F-67). HL7®, and FHIR® are the registered trademarks of Health Level Seven International and their use of these trademarks does not constitute an endorsement by HL7. This project is an independent work."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Forwarded to the map crate, which is where the bundled maps live (F-33).
# A store is useless without a map, so the same version choice applies here.
default = ["r5"]
r3 = ["fhir-mssql-map/r3"]
r4 = ["fhir-mssql-map/r4"]
r5 = ["fhir-mssql-map/r5"]

[dependencies]
# The engine-agnostic half: the audit chain and the value types every port
# returns. One crate rather than six copies (F-45).
fhir-store = { path = "../../../fhir-store", version = "0.2.0" }
fhir-mssql-map.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tiberius.workspace = true
tokio-util.workspace = true
bb8.workspace = true
async-trait = "0.1"
# Only for rendering the DATE/DATETIME2 sort columns tiberius returns as its
# own `Date`/`DateTime2`, which `FromSql` converts to `chrono` types (tds73
# feature) — not for anything this store decides on its own.
chrono = { version = "0.4", default-features = false, features = ["std"] }
tracing.workspace = true
sha2.workspace = true
sha3.workspace = true
hmac.workspace = true
subtle.workspace = true
zeroize.workspace = true
getrandom.workspace = true

[dev-dependencies]
fhir-mssql-map.workspace = true
fhir-mssql-gen.workspace = true
tiberius.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
