[workspace]
# The fuzz crate needs nightly-only libfuzzer-sys, so it stays out of the
# workspace: a normal `cargo build` must not require a nightly toolchain.
exclude = ["fuzz"]
resolver = "3"
members = [
    "crates/fhir-mssql-map",
    "crates/fhir-mssql-gen",
    "crates/fhir-mssql-store",
]

[workspace.package]
version = "0.5.1"
keywords = ["fhir", "healthcare", "sqlserver", "hl7", "medical"]
categories = ["database", "science", "data-structures"]
edition = "2024"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/fhir-rust/fhir-rust/"
rust-version = "1.90"

[workspace.dependencies]
fhir-mssql-map = { path = "crates/fhir-mssql-map", version = "0.5.1" }
fhir-mssql-gen = { path = "crates/fhir-mssql-gen", version = "0.5.1" }
fhir-mssql-store = { path = "crates/fhir-mssql-store", version = "0.5.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "preserve_order"] }
thiserror = "2"
anyhow = "1"
flate2 = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
getrandom = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
# The SQL Server driver: pure Rust TDS, so no ODBC or FreeTDS on the host.
# `rustls` for TLS because SQL Server negotiates TLS during login even for
# an otherwise plaintext connection.
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
# tiberius ships no connection pool of its own (unlike mysql_async's Pool or
# tokio-postgres's deadpool). bb8 is driver-agnostic -- the store implements a
# ~30-line ManageConnection rather than pulling in a tiberius-specific pooling
# crate, none of which is mature enough to depend on for a PHI-handling store.
bb8 = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
