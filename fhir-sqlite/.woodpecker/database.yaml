# Live-database tests against real SQLite.
#
# fhir-sqlite's guarantees are database guarantees — isolation, locking, the
# append-only trigger, the hash chain, index-using search plans. None of them
# can be tested without the real engine, so this pipeline is not optional
# coverage; it is where most of the suite is meant to run. See
# doc/containers.md to run the same thing locally from the same pinned image.
when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

variables:
  - &rust "docker.io/library/rust:1"

# No service: SQLite is a library, not a server. What is pinned instead is the
# sqlite3 *version*, because its DDL features move between releases and
# "passed on whatever the runner shipped" is a weaker claim than "passed on a
# known version".

steps:
  # The live tests need the FHIR definitions (to generate the maps) and the
  # example corpora (to gate round-tripping against real resources).
  - name: fetch-spec
    image: docker.io/library/debian:stable-slim
    commands:
      - apt-get update -qq && apt-get install -y -qq curl unzip ca-certificates
      - mkdir -p spec-cache corpus
      - |
        for pair in "r5 R5" "r4 R4" "r3 STU3"; do
          set -- $pair
          mkdir -p "spec-cache/$1/fhir-definitions-json"
          curl -sSL "https://hl7.org/fhir/$2/definitions.json.zip" -o defs.zip
          unzip -qo defs.zip -d "spec-cache/$1/fhir-definitions-json"
          curl -sSL "https://hl7.org/fhir/$2/examples-json.zip" -o ex.zip
          cdir=$(echo "$1" | sed 's/r3/stu3/')
          mkdir -p "corpus/$cdir"
          unzip -qo ex.zip -d "corpus/$cdir"
        done

  - name: live-tests
    image: *rust
    environment:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /woodpecker/src/.cargo
      CARGO_TARGET_DIR: /woodpecker/src/target
      FHIR_SQLITE_TEST_DB: /woodpecker/src/target/ci.sqlite
      FHIR_SQLITE_SPEC_DIR: /woodpecker/src/spec-cache
      FHIR_SQLITE_CORPUS_DIR: /woodpecker/src/corpus
      FHIR_SQLITE_TEST_CORPUS_LIMIT: "400"
      FHIR_SQLITE_PROPTEST_CASES: "10000"
    commands:
      - apt-get update -qq && apt-get install -y -qq sqlite3
      - sqlite3 --version
      # Installs every generated schema — all three FHIR versions, thousands of
      # tables each — into a real SQLite database. This is the pipeline's core
      # claim today, and it does not depend on the store port (T64).
      - cargo test --release --locked -p fhir-sqlite-map --test sqlite_ddl -- --nocapture --test-threads=1
      - cargo test --release --locked -p fhir-sqlite-gen --test proptest_roundtrip -- --nocapture
      # The store suite still speak tokio-postgres (T64), so they
      # self-skip rather than exercising SQLite. Run anyway, so the gap is
      # visible in the log instead of inferred from its absence.
      - echo "store live suite are not yet ported to SQLite (T64); they self-skip"
      - cargo test --release --locked -p fhir-sqlite-store -- --nocapture --test-threads=1
