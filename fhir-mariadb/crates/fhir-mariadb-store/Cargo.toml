[package]
name = "fhir-mariadb-store"
description = "MariaDB storage layer for fhir-mariadb. HL7®, and FHIR® are the registered trademarks of Health Level Seven International and their use of these trademarks does not constitute an endorsement by HL7. This project is an independent work."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Forwarded to the map crate, which is where the bundled maps live (F-33).
# A store is useless without a map, so the same version choice applies here.
default = ["r5"]
r3 = ["fhir-mariadb-map/r3"]
r4 = ["fhir-mariadb-map/r4"]
r5 = ["fhir-mariadb-map/r5"]

[dependencies]
# The engine-agnostic half: the audit chain and the value types every port
# returns. One crate rather than six copies (F-45).
fhir-store = { path = "../../../fhir-store", version = "0.2.0" }
fhir-mariadb-map.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
mysql_async.workspace = true
tracing.workspace = true
sha2.workspace = true
sha3.workspace = true
hmac.workspace = true
subtle.workspace = true
zeroize.workspace = true
getrandom.workspace = true

[dev-dependencies]
fhir-mariadb-map.workspace = true
# The upgrade suite simulates a pre-asset install by deleting a meta row, which
# needs a connection the store deliberately does not expose.
mysql_async.workspace = true
fhir-mariadb-gen.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
