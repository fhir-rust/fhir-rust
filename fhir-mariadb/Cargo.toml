[workspace]
# The fuzz crate needs nightly-only libfuzzer-sys, so it stays out of the
# workspace: a normal `cargo build` must not require a nightly toolchain.
exclude = ["fuzz"]
resolver = "3"
members = [
    "crates/fhir-mariadb-map",
    "crates/fhir-mariadb-gen",
    "crates/fhir-mariadb-store",
]

[workspace.package]
version = "0.6.0"
keywords = ["fhir", "healthcare", "mariadb", "hl7", "medical"]
categories = ["database", "science", "data-structures"]
edition = "2024"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/fhir-rust/fhir-rust/"
rust-version = "1.96"

[workspace.dependencies]
fhir-mariadb-map = { path = "crates/fhir-mariadb-map", version = "0.6.0" }
fhir-mariadb-gen = { path = "crates/fhir-mariadb-gen", version = "0.6.0" }
fhir-mariadb-store = { path = "crates/fhir-mariadb-store", version = "0.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "preserve_order"] }
thiserror = "2"
anyhow = "1"
flate2 = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.13"
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
getrandom = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
# The MySQL/MariaDB driver: async and pure Rust, so it needs no client
# library on the host and no spawn_blocking.
# `rustls-tls`, not `minimal` alone: `minimal` excludes TLS entirely, which is
# how this port shipped a plaintext-only connection (O10.7, F-54). rustls
# rather than native-tls to match every other port and avoid an OpenSSL build
# dependency.
#
# `ring` alongside it, not optional: since mysql_async 0.37 (F-94), the
# bare `rustls-tls` feature is provider-agnostic and installs no
# process-level rustls::crypto::CryptoProvider, so the first real TLS
# handshake panics ("Could not automatically determine the process-level
# CryptoProvider... call CryptoProvider::install_default()") rather than
# quietly picking one. `ring` over `aws-lc-rs`: it is pure Rust and needs no
# C compiler or cmake, keeping the build-dependency profile this comment
# already commits to. Verified: reproduced the panic live against this
# port's mariadb dev container with `ring` absent, gone with it present.
mysql_async = { version = "0.37", default-features = false, features = ["minimal", "rustls-tls", "ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
