[workspace]
# The fuzz crate needs nightly-only libfuzzer-sys, so it stays out of the
# workspace: a normal `cargo build` must not require a nightly toolchain.
exclude = ["fuzz"]
resolver = "3"
members = [
    "crates/fhir-oracle-map",
    "crates/fhir-oracle-gen",
    "crates/fhir-oracle-store",
]

[workspace.package]
version = "0.5.1"
keywords = ["fhir", "healthcare", "oracle", "hl7", "medical"]
categories = ["database", "science", "data-structures"]
edition = "2024"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/fhir-rust/fhir-rust/"
rust-version = "1.90"

[workspace.dependencies]
fhir-oracle-map = { path = "crates/fhir-oracle-map", version = "0.5.1" }
fhir-oracle-gen = { path = "crates/fhir-oracle-gen", version = "0.5.1" }
fhir-oracle-store = { path = "crates/fhir-oracle-store", version = "0.5.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "preserve_order"] }
thiserror = "2"
anyhow = "1"
flate2 = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
getrandom = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
# The `oracle` crate (ODPI-C/OCI bindings) — chosen 2026-08-04 over sqlx per
# Decision D5's reasoning elsewhere in this workspace (the SQL is generated,
# so compile-time checked queries buy nothing) and over a hand-rolled OCI
# binding as unjustifiable scope for a port with no live engine to develop
# against. Builds and `cargo check`s cleanly with no Oracle Instant Client on
# the host — ODPI-C loads `libclntsh` via `dlopen` at connection time, not
# link time — which is also why the store could be written before Instant
# Client was available and connected live once it was; see
# `spec/databases/audit.md` **F-68** (superseding **F-66**). `chrono` for
# TIMESTAMP(6)/DATE columns, matching every other port's driver choice.
oracle = { version = "0.6", features = ["chrono"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
