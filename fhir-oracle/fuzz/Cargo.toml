# Fuzz targets for spec T11.9: adversarial input must not crash a server that
# accepts documents and queries from the network.
#
# Kept out of the workspace so a normal `cargo build` does not need the
# nightly-only libfuzzer-sys. Run with:
#
#     cargo +nightly fuzz run shred -- -max_total_time=60
#
# There is no `search_sql` target here, unlike the four ports that have a store.
# It was a copy of fhir-postgresql's and called `<crate>::search`, a module this
# port does not have — so it had never compiled. A fuzz target that cannot build
# claims coverage it does not provide (T11.9), which is worse than its absence.
# It returns with the store.
[package]
name = "fhir-oracle-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
fhir-oracle-map = { path = "../crates/fhir-oracle-map" }
fhir-oracle-store = { path = "../crates/fhir-oracle-store" }

[[bin]]
name = "shred"
path = "fuzz_targets/shred.rs"
test = false
doc = false
bench = false
