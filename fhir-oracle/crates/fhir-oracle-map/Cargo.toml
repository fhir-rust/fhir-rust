[package]
name = "fhir-oracle-map"
description = "Relational map and shred/reconstruct engine for fhir-oracle (Oracle DDL, live-verified on Oracle 26ai Free - audit.md F-08). HL7®, and FHIR® are the registered trademarks of Health Level Seven International and their use of these trademarks does not constitute an endorsement by HL7. This project is an independent work."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Which FHIR versions' maps are compiled in (F-33). Each is 0.5-1.2 MB in the
# binary and most callers want one, so they are opt-in — the same shape the
# model family uses for its release crates. `r5` is on by default.
#
# These gate compilation, not download: a .crate archive is static, so all
# three maps ship with it regardless.
default = ["r5"]
r3 = []
r4 = []
r5 = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
flate2.workspace = true
unicode-normalization.workspace = true
# U4: the checksum adjunct is computed here, never by a SQL function.
sha2.workspace = true

[dev-dependencies]
# For tests/oracle_ddl.rs only (F-51): does the generated DDL actually install
# on a real server? `oracle` binds ODPI-C, which needs Oracle Instant Client
# present on the host at build and test time — the same dependency
# `fhir-oracle-store` already carries and F-68 already proved works live, so
# this is not a new architectural question, just this crate's own copy of a
# path already verified to work. Synchronous, unlike `fhir-mssql-map`'s
# `tiberius` dev-dependency, so no tokio dev-dependency is needed here.
oracle = { workspace = true, features = ["chrono"] }
