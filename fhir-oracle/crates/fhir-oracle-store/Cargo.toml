[package]
name = "fhir-oracle-store"
description = "Oracle Database storage layer for fhir-oracle (Store level: live-verified against gvenzl/oracle-free, with snapshot reads verified on Oracle 26ai Free). HL7®, and FHIR® are the registered trademarks of Health Level Seven International and their use of these trademarks does not constitute an endorsement by HL7. This project is an independent work."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Forwarded to the map crate, which is where the bundled maps live (F-33).
# A store is useless without a map, so the same version choice applies here.
default = ["r5"]
r3 = ["fhir-oracle-map/r3"]
r4 = ["fhir-oracle-map/r4"]
r5 = ["fhir-oracle-map/r5"]

[dependencies]
# The engine-agnostic half: the audit chain and the value types every port
# returns. One crate rather than six copies (F-45).
fhir-store = { path = "../../../fhir-store", version = "0.3.0" }
fhir-oracle-map.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
oracle.workspace = true
# Parses the ISO-8601 strings shred/utc_micros produce into `oracle`'s own
# `sql_type::Timestamp` (no chrono needed).
jiff = { version = "0.2", default-features = false, features = ["std"] }
tracing.workspace = true
sha2.workspace = true
sha3.workspace = true
hmac.workspace = true
subtle.workspace = true
zeroize.workspace = true
getrandom.workspace = true

[dev-dependencies]
fhir-oracle-map.workspace = true
fhir-oracle-gen.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
