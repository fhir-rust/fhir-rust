[package]
name = "fhir-release-6"
description = "FHIR Release 6 (6.0.0-ballot3) data model, generated from a DRAFT specification: every resource and datatype as typed Rust, with validation, builders, and serde."
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/fhir-rust-crate/fhir-rust-crate"
keywords = ["fhir", "hl7", "healthcare", "medical", "r6"]
categories = ["data-structures", "encoding"]
include = ["/src/**", "/README.md"]

[features]
# Forwarded to fhir-core rather than redefined, so the feature sets cannot
# drift apart between the release crates and the core they share.
client = ["fhir-core/client"]
xml = ["fhir-core/xml"]

[dependencies]
fhir-core = { path = "../fhir-core", version = "3.0.0" }
fhir-derive-macros = { path = "../fhir-derive-macros", version = "1.1.0" }
serde = { version = "~1.0.228", features = ["derive"] }
serde_json = { version = "~1.0.150", features = ["arbitrary_precision"] }
serde_with = { version = "3.21" }
vec1 = { version = "1.12", features = ["serde"] }
convert_case = { version = "0.11" } # Used by the work-in-progress `parse` helpers.

[lints.rust]
unsafe_code = "forbid"

# A dev-dependency cycle, which Cargo permits: `fhir` depends on this crate,
# and this crate's doctests depend on `fhir`. The 260 examples here are
# written `use fhir::r6::…` because that is the path users actually type;
# rewriting them to `fhir_6::…` would document an internal crate name and
# quietly diverge from what the facade exposes.
[dev-dependencies]
fhir = { path = "..", default-features = false, features = ["r6"] }
