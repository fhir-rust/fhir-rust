# Supply-chain policy (spec 13, R13.13).
#
# This model is compiled into systems that store patient data, so its
# dependency set is evidence someone will be asked to produce. Keeping it
# green continuously is far cheaper than reconstructing it during an audit.

[advisories]
# Any unpatched advisory fails the build. When one has no fix yet, add it
# here with a dated note rather than lowering the bar globally.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. Anything copyleft in a linked dependency would
# change the licensing of a deployment we do not control.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions are allowed but visible: they are how a
# vulnerable transitive copy survives an upgrade of its sibling.
multiple-versions = "warn"
wildcards = "deny"
# Each release crate dev-depends on the facade by path with no version, so
# its doctests can be written `use fhir::r4::…` — the path a user actually
# types — rather than `use fhir_r4::…`, which would document an internal crate
# name. A path dependency carries no version to pin, so `wildcards = "deny"`
# flags all seven. They are not a supply-chain risk: a path dependency
# resolves inside this workspace and is stripped from the published package,
# so no consumer ever resolves it. Registry wildcards, the case this check
# exists for, stay denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
