[package]
name = "fhir-r5"
description = "FHIR Release 5 (5.0.0) data model: every resource and datatype as typed Rust, with validation, builders, and serde."
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/fhir-rust/fhir-rust/"
keywords = ["fhir", "hl7", "healthcare", "medical", "r5"]
categories = ["data-structures", "encoding"]
include = ["/src/**", "/README.md",
    "/LICENSE.md",
]

[features]
# Forwarded to fhir-core rather than redefined, so the feature sets cannot
# drift apart between the release crates and the core they share.
client = ["fhir-core/client"]
xml = ["fhir-core/xml"]

[dependencies]
fhir-core = { path = "../fhir-core", version = "3.0.0" }
fhir-derive-macros = { path = "../fhir-derive-macros", version = "1.2.0" }
serde = { version = "~1.0.229", features = ["derive"] }
serde_json = { version = "~1.0.151", features = ["arbitrary_precision", "float_roundtrip"] }
serde_with = { version = "3.21" }
vec1 = { version = "1.12", features = ["serde"] }
convert_case = { version = "0.11" } # Used by the work-in-progress `parse` helpers.

[lints.rust]
unsafe_code = "forbid"

# A dev-dependency cycle, which Cargo permits: `fhir` depends on this crate,
# and this crate's doctests depend on `fhir`. The 260 examples here are
# written `use fhir::r5::…` because that is the path users actually type;
# rewriting them to `fhir_5::…` would document an internal crate name and
# quietly diverge from what the facade exposes.
[dev-dependencies]
fhir = { path = "..", default-features = false, features = ["r5"] }
