[package]
name = "fhir-derive-macros"
version = "1.6.0"
edition = "2021"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Procedural macros for the `fhir` crate, providing #[derive(Validate)]. HL7®, and FHIR® are the registered trademarks of Health Level Seven International and their use of these trademarks does not constitute an endorsement by HL7. This project is an independent work."
repository = "https://github.com/fhir-rust/fhir-rust/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["fhir", "healthcare", "validate", "derive", "macro"]
categories = ["development-tools", "science"]
rust-version = "1.96"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
