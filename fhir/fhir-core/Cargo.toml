[package]
name = "fhir-core"
description = "Release-independent core for the FHIR crates: decimal, validation, coded values, builders, temporal parsing, XML, and the REST client."
version = "3.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/fhir-rust/fhir-rust/"
keywords = ["fhir", "hl7", "healthcare", "medical", "interoperability"]
categories = ["data-structures", "encoding"]
include = ["/src/**", "/README.md",
    "/LICENSE.md",
]

[features]
# Mirrors of the parent crate's features, forwarded rather than redefined, so
# a consumer enabling `fhir/xml` gets `fhir-core/xml` and the two cannot drift.
client = ["dep:reqwest", "dep:tokio"]
xml = ["dep:quick-xml"]
precise-decimal = []

[dependencies]
serde = { version = "~1.0.229", features = ["derive"] }
# Not optional, for the same reason as in the parent crate: FHIR treats
# decimal precision as clinical data, and without `arbitrary_precision`
# `0.50` serializes back as `0.5`.
serde_json = { version = "~1.0.151", features = ["arbitrary_precision", "float_roundtrip"] }
vec1 = { version = "1.12", features = ["serde"] }
convert_case = { version = "0.11" }
reqwest = { version = "0.12", features = ["json"], optional = true }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
], optional = true }
quick-xml = { version = "0.41", optional = true }

[dev-dependencies]
# The doctests demonstrate this crate through the facade (`use fhir::…`),
# which is how a reader actually reaches it — several need a release model
# (`fhir::r5::meta`) that this release-independent crate deliberately does
# not have. A dev-dependency cycle is the standard way to let those examples
# compile from this crate's own test harness (T49): cargo resolves
# dev-dependencies separately, so the cycle is legal and nothing ships.
# Before this, `cargo test -p fhir-core --doc` could not compile 13 doctests
# and no CI invocation ran them at all.
# Path-only, like the release crates' dev-dependency on the facade: cargo
# strips a versionless path dev-dep at publish, which is what breaks the
# publish-order cycle (the facade depends on this crate, and this crate's
# doctests demonstrate it through the facade).
fhir = { path = ".." }

[lints.rust]
unsafe_code = "forbid"
