# Supply-chain policy (spec O10.10).
#
# fhir-mysql stores patient data, so its dependency set is evidence someone will
# be asked to produce. Keeping this green continuously is far cheaper than
# reconstructing it during an audit.

[advisories]
# Any unpatched advisory fails the build. When one has no fix yet, add it
# here with a dated note rather than lowering the bar globally.
yanked = "deny"
# Resolved 2026-08-27: mysql_async bumped 0.34 -> 0.37 (GHSA-rhfx-m35p-ff5j,
# an `lru` soundness advisory that needed it) and rustls-pemfile — the
# subject of the entry this comment replaces — dropped out of the tree
# entirely as a side effect, verified absent from both lockfiles. No ignore
# needed; recorded here rather than left silent, so a future reader does not
# wonder why the exception vanished.
ignore = []

[licenses]
# Permissive licences only. Anything copyleft in a linked dependency would
# change the licensing of a deployment we do not control.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # webpki-roots ships Mozilla's CA certificate *data* under the Community
    # Data License Agreement; it is a permissive data licence, and the data
    # is the public trust store, not code.
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions are allowed but visible: they are how a
# vulnerable transitive copy survives an upgrade of its sibling.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# webpki 0.22 predates SPDX metadata in its manifest; its stated terms are
# ISC-style (the LICENSE file in the crate). Clarified rather than allowed
# blind, so a future license change in a new version is still caught.
[[licenses.clarify]]
name = "webpki"
version = "0.22.4"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]
