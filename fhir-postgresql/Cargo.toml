[workspace]
# The fuzz crate needs nightly-only libfuzzer-sys, so it stays out of the
# workspace: a normal `cargo build` must not require a nightly toolchain.
exclude = ["fuzz"]
resolver = "3"
members = [
    "crates/fhir-postgresql-map",
    "crates/fhir-postgresql-gen",
    "crates/fhir-postgresql-store",
]

[workspace.package]
version = "0.6.3"
keywords = ["fhir", "healthcare", "postgresql", "hl7", "medical"]
categories = ["database", "science", "data-structures"]
edition = "2024"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-NC-SA-4.0"
repository = "https://github.com/fhir-rust/fhir-rust/"
rust-version = "1.98"

[workspace.dependencies]
fhir-postgresql-map = { path = "crates/fhir-postgresql-map", version = "0.6.3" }
fhir-postgresql-gen = { path = "crates/fhir-postgresql-gen", version = "0.6.3" }
fhir-postgresql-store = { path = "crates/fhir-postgresql-store", version = "0.6.3" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "preserve_order"] }
thiserror = "2"
anyhow = "1"
flate2 = "1"
unicode-normalization = "0.1"
# FNV-1a for truncated index names (RCA-EXC-3: hashes come from a vetted crate).
fnv = "1"
sha2 = "0.11"
sha3 = "0.12"
hmac = "0.13"
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
getrandom = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# RCA-ENF-4: a plain operator the lints miss panics instead of wrapping silently.
overflow-checks = true
lto = "thin"

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false

# Faster dev/test builds: keep line tables for backtraces, drop the rest of the debug info.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
