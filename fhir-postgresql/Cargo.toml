[workspace]
# The fuzz crate needs nightly-only libfuzzer-sys, so it stays out of the
# workspace: a normal `cargo build` must not require a nightly toolchain.
exclude = ["fuzz"]
resolver = "3"
members = [
    "crates/fhir-postgresql-map",
    "crates/fhir-postgresql-gen",
    "crates/fhir-postgresql-store",
]

[workspace.package]
version = "0.5.1"
keywords = ["fhir", "healthcare", "postgresql", "hl7", "medical"]
categories = ["database", "science", "data-structures"]
edition = "2024"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/fhir-rust/fhir-rust/"
rust-version = "1.90"

[workspace.dependencies]
fhir-postgresql-map = { path = "crates/fhir-postgresql-map", version = "0.5.1" }
fhir-postgresql-gen = { path = "crates/fhir-postgresql-gen", version = "0.5.1" }
fhir-postgresql-store = { path = "crates/fhir-postgresql-store", version = "0.5.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip", "preserve_order"] }
thiserror = "2"
anyhow = "1"
flate2 = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.13"
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
getrandom = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
