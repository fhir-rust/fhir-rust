# The gates that cannot live in a per-port workflow.
#
# X15.1 requires the pure-Rust core to be identical across all six database
# ports, and W16.6 requires CI to verify it. That check is inherently
# cross-port: no workflow under fhir-<engine>/ can make it, because each sees
# only its own tree.
#
# Both are cross-cutting: the shared-core check compares six ports against each
# other, and the doc-example check compiles prose that describes all of them.
#
# For a while (F-49) this was the only workflow in this repository that ran:
# the families kept theirs under <family>/.github/workflows/, which GitHub
# does not read — correct when each family was its own repository, inert once
# they were merged. The 2026-08-06 consolidation moved every family's CI to
# sibling files in this directory, each with a paths filter and a
# working-directory default; this file keeps only the cross-port gates no
# single family can run.
name: repository gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every job below that builds Rust starts by removing preinstalled tooling
# this repository never uses — Android SDK/NDK, .NET, GHC, Swift — which
# otherwise leaves only ~14 GB free on a stock ubuntu-latest runner before
# anything is built. Not a hypothetical: this repository has already hit a
# hosted-runner ceiling once (see the comment above the fhir/ build matrix —
# a combined build was SIGTERM-killed at 12.9 GB peak RSS on a 7 GB runner),
# and every crate this monorepo adds makes the margin thinner, not wider.
#
jobs:
  shared-core:
    name: X15.1 — shared core identical across six ports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bash, python3, and diff only. Deliberately no Rust toolchain: this
      # compares text and must stay fast enough that nobody is tempted to skip
      # it, and it must keep working if a port stops compiling.
      - name: Check
        run: ./scripts/check-shared-core.sh --diff

  tags:
    name: TG1 — tags name published versions
    runs-on: ubuntu-latest
    steps:
      # Tags are the point of this job, and actions/checkout fetches none by
      # default.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check
        run: ./scripts/check-tags.sh

  forbid-unsafe:
    name: R13.14 — every crate root forbids unsafe code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Text only, no toolchain: this asserts that the attribute is present,
      # which is a property of the source. That the attribute also *compiles*
      # everywhere is asserted by each family's own build job.
      - name: Check
        run: ./scripts/check-forbid-unsafe.sh

  trademarks:
    name: HL7® fair use — registration mark and disclaimer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # spec/hl7-trademarks-fair-use/ ends with "Assurance: create automatic
      # tests to verify this works." A trademark obligation is exactly the kind
      # that gets satisfied once by hand and then lost on the next new page, so
      # it is gated rather than remembered. python3 only; no toolchain.
      - name: Check
        run: ./scripts/check-trademarks.sh

  doc-examples:
    name: F-60 — every documented example compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (unused preinstalled runner bloat)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /opt/az "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Unlike the shared-core check this one needs a toolchain: it compiles
      # each ```rust block from doc/ and README.md against the real crates.
      # It found six defects on its first run, one of which did not parse.
      - name: Check
        run: ./scripts/check-doc-examples.sh
