# fhir-store never had a workflow anywhere — the shared persistence core was
# tested only transitively, through the six ports that depend on it, and its
# cargo-deny policy (added under F-43) ran on no machine but the one that
# wrote it. Added with the F-49 consolidation.
name: fhir-store CI

on:
  push:
    branches: [main]
    paths:
      - 'fhir-store/**'
      - '.github/workflows/fhir-store-ci.yml'
  pull_request:
    paths:
      - 'fhir-store/**'
      - '.github/workflows/fhir-store-ci.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: fhir-store

# Every job below that builds Rust starts by removing preinstalled tooling
# this repository never uses — Android SDK/NDK, .NET, GHC, Swift — which
# otherwise leaves only ~14 GB free on a stock ubuntu-latest runner before
# anything is built. Not a hypothetical: this repository has already hit a
# hosted-runner ceiling once (see the comment above the fhir/ build matrix —
# a combined build was SIGTERM-killed at 12.9 GB peak RSS on a 7 GB runner),
# and every crate this monorepo adds makes the margin thinner, not wider.
#
jobs:
  test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (unused preinstalled runner bloat)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /opt/az "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-store
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rust-version` in Cargo.toml is a promise to downstream users. Without
      # a job that builds on exactly that toolchain it is only a claim, and it
      # breaks silently the first time anyone uses a newer language feature.
      # This crate declared none at all until 2026-08-29 (RV1.4 unmet, spec
      # spec/rust-msrv-n-minus-2/) — this job is what RV1.5 requires the
      # moment a value exists.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "MSRV is $v"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-store
          key: msrv-${{ steps.msrv.outputs.version }}
      - run: cargo check --workspace --all-targets --locked

  supply-chain:
    name: cargo-deny (O10.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (unused preinstalled runner bloat)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /opt/az "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-store
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
