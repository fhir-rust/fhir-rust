name: fhir-oracle CI

on:
  push:
    branches: [main]
    paths:
      - 'fhir-oracle/**'
      - '.github/workflows/fhir-oracle-ci.yml'
      - 'fhir-store/**'
  pull_request:
    paths:
      - 'fhir-oracle/**'
      - '.github/workflows/fhir-oracle-ci.yml'
      - 'fhir-store/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Consolidated from fhir-oracle/.github/workflows/ (F-49): GitHub only reads
# workflows at the repository root, so the per-family copy never ran.
defaults:
  run:
    working-directory: fhir-oracle

jobs:
  test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-oracle
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Unit tests pass with no database and no spec packages present;
      # the corpus/spec-driven tests skip themselves when inputs are absent.
      - run: cargo test --workspace
      - name: Build the book
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          ./mdbook build book

  # This job was deliberately absent until 2026-08-12. Until 2026-07-31 the
  # file provisioned `mysql:8.4` for a port that could not talk to any
  # database — theatre, removed as audit finding F-06, because a green gate
  # against the wrong engine is a false claim about clinical software. It
  # returns now that both of its old preconditions hold: real Oracle DDL
  # (F-08 fixed) and a real store, live-tested against this same image
  # (F-68). The arm64 question that once clouded "can live verification be
  # promised" does not arise here: hosted runners are x86-64.
  database:
    name: Live-database tests (Oracle Database Free 23)
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: Fhir-Oracle-CI-2026
          ORACLE_DATABASE: FHIR
        ports:
          - 1521:1521
        # The image ships its own probe; a port check would report ready
        # while the instance is still opening the pluggable database.
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60
          --health-start-period 30s
    env:
      FHIR_ORACLE_TEST_USER: r5
      FHIR_ORACLE_TEST_PASSWORD: Fhir-Oracle-CI-2026
      FHIR_ORACLE_TEST_CONNECT: 127.0.0.1:1521/FHIR
      # A live job that reaches no server must be red, not a green run
      # that skipped everything (T11.12, T11.13, F-06).
      FHIR_ORACLE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-oracle
      # The `oracle` crate loads Oracle's client libraries at runtime
      # (ODPI-C); without them every connect dies with DPI-1047 — found
      # locally the hard way (scripts/db.sh documents it). Ubuntu 24.04
      # renamed libaio1 to libaio1t64, and the client still looks for
      # libaio.so.1, hence the symlink.
      - name: Oracle Instant Client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libaio1t64 || sudo apt-get install -y -qq libaio1
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 \
            /usr/lib/x86_64-linux-gnu/libaio.so.1 2>/dev/null || true
          curl -sSLo ic.zip \
            https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          sudo mkdir -p /opt/oracle
          sudo unzip -q ic.zip -d /opt/oracle
          echo "LD_LIBRARY_PATH=$(echo /opt/oracle/instantclient_*)" >> "$GITHUB_ENV"
      # The uppercase users mirror scripts/db.sh's post_ready: unquoted
      # Oracle identifiers resolve uppercase, and a lowercase-quoted user
      # whose session identity still resolved uppercase was a live bug —
      # both the user and `RelMap.schema` are `R5`, never `r5` (M14.5).
      - name: Create the version users
        run: |
          set -euo pipefail
          for v in R3 R4 R5; do
            docker exec -i ${{ job.services.oracle.id }} bash -c "sqlplus -s system/Fhir-Oracle-CI-2026@localhost/FHIR" <<SQL
          WHENEVER SQLERROR EXIT FAILURE
          BEGIN EXECUTE IMMEDIATE 'DROP USER $v CASCADE'; EXCEPTION WHEN OTHERS THEN IF SQLCODE != -1918 THEN RAISE; END IF; END;
          /
          CREATE USER $v IDENTIFIED BY "Fhir-Oracle-CI-2026";
          GRANT CREATE SESSION, CREATE TABLE, CREATE TRIGGER, CREATE PROCEDURE, CREATE SEQUENCE, UNLIMITED TABLESPACE TO $v;
          EXIT
          SQL
          done
      # Fails rather than skips without a database (F-06's discipline): the
      # env above is unconditionally set, so a test that cannot connect
      # panics loudly instead of printing "skipping".
      - name: Store live suite
        run: cargo test --release -p fhir-oracle-store -- --nocapture --test-threads=1

  # The TLS-only database job from the PostgreSQL original is likewise not
  # ported. Oracle is a network server, so transport security applies (Oracle
  # Net encryption and/or TLS, spec M14.22) and this job should exist one day —
  # but it cannot be written at all until there is a driver and a store.

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rust-version` in Cargo.toml is a promise to downstream users. Without
      # a job that builds on exactly that toolchain it is only a claim, and it
      # breaks silently the first time anyone uses a newer language feature.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "MSRV is $v"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-oracle
          key: msrv-${{ steps.msrv.outputs.version }}
      - run: cargo check --workspace --all-targets --locked

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [shred]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-oracle
          key: fuzz-${{ matrix.target }}
      # T11.9: targets that are committed but never executed prove nothing.
      #
      # `search_sql` checks a property, not just the absence of a crash:
      # every attacker-controlled search value must end up in the bind list,
      # never spliced into the SQL. That separation is what makes injection
      # impossible, and a fuzzer can check it directly. Verified by breaking
      # it — interpolating one value into the query fails the target at once.
      #
      # Both targets read a committed two-resource map, so neither needs a
      # specification download or a database.
      - run: cargo install cargo-fuzz --locked
      - name: Run ${{ matrix.target }}
        run: |
          mkdir -p /tmp/corpus/${{ matrix.target }}
          cp fuzz/seeds/${{ matrix.target }}/* /tmp/corpus/${{ matrix.target }}/ 2>/dev/null || true
          cargo +nightly fuzz run ${{ matrix.target }} /tmp/corpus/${{ matrix.target }} -- \
            -max_total_time=120 -rss_limit_mb=4096
      - name: Upload any crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fhir-oracle/fuzz/artifacts/

  published-versions:
    name: No version diverges from crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A crates.io version is immutable. If this tree carries a version that
      # is already published, the two must agree — otherwise the published
      # artifact and the source disagree while every local build stays green,
      # because a local build resolves the path dependency and never fetches
      # the registry copy. The divergence then surfaces only when someone
      # packages a dependent, as an error about code they did not touch.
      - name: Compare each published version against this tree
        run: |
          fail=0
          for crate in fhir-oracle-map fhir-oracle-gen fhir-oracle-store; do
            version=$(cargo metadata --format-version 1 --no-deps \
              | python3 -c "import json,sys;print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='$crate'))")
            url="https://static.crates.io/crates/$crate/$crate-$version.crate"
            if ! curl -sfL "$url" -o /tmp/pub.crate; then
              echo "$crate $version: unpublished, nothing to compare"
              continue
            fi
            rm -rf /tmp/pubx && mkdir -p /tmp/pubx
            tar xzf /tmp/pub.crate -C /tmp/pubx
            if diff -rq "/tmp/pubx/$crate-$version/src" "crates/$crate/src" >/dev/null 2>&1; then
              echo "$crate $version: matches crates.io"
            else
              echo "::error::$crate $version is published but differs from this tree; bump it"
              diff -rq "/tmp/pubx/$crate-$version/src" "crates/$crate/src" || true
              fail=1
            fi
          done
          exit "$fail"

  supply-chain:
    name: Advisories, licenses, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-oracle
      # A component handling clinical data is part of someone's IEC 62304
      # file (spec O10.10). This evidence is cheap to keep green continuously
      # and expensive to reconstruct after the fact.
      - name: cargo-deny (advisories, licenses, sources, bans)
        uses: EmbarkStudios/cargo-deny-action@v2
        # `uses:` steps ignore defaults.run.working-directory, so the
        # manifest must be named explicitly (found by the first hosted run:
        # the action ran at the repo root, where there is no Cargo.toml).
        with:
          command: check
          manifest-path: fhir-oracle/Cargo.toml
      - name: CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: "fhir-oracle/**/*.cdx.json"
