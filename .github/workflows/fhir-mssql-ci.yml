name: fhir-mssql CI

on:
  push:
    branches: [main]
    paths:
      - 'fhir-mssql/**'
      - '.github/workflows/fhir-mssql-ci.yml'
      - 'fhir-store/**'
  pull_request:
    paths:
      - 'fhir-mssql/**'
      - '.github/workflows/fhir-mssql-ci.yml'
      - 'fhir-store/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Consolidated from fhir-mssql/.github/workflows/ (F-49): GitHub only reads
# workflows at the repository root, so the per-family copy never ran.
defaults:
  run:
    working-directory: fhir-mssql

jobs:
  test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-mssql
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Unit tests pass with no database and no spec packages present;
      # the corpus/spec-driven tests skip themselves when inputs are absent.
      - run: cargo test --workspace
      - name: Build the book
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          ./mdbook build book

  database:
    name: Live-database tests (SQL Server 2022)
    runs-on: ubuntu-latest
    services:
      db:
        # SQL Server, not a substitute. This job provisioned `mysql:8.4` until
        # 2026-07-31 and invoked `--test mysql_ddl` — a target that does not
        # exist in this package — so it failed on `no test target named
        # mysql_ddl` and had never executed one assertion of the T-SQL it
        # exists to verify (spec O10.12, C0.10; audit F-06).
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Fhir-Mssql-CI-2026!"
          MSSQL_PID: Developer
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Fhir-Mssql-CI-2026!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    env:
      FHIR_MSSQL_TEST_DSN: "server=tcp:127.0.0.1,1433;user=sa;password=Fhir-Mssql-CI-2026!;TrustServerCertificate=true"
      # A skip is indistinguishable from a pass in a CI summary (T11.12).
      # This makes an absent or unreachable database a failure (M14.30).
      FHIR_MSSQL_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-mssql
      # The live tests need the FHIR definitions and an example corpus.
      - name: Fetch FHIR spec packages and example corpora
        run: |
          mkdir -p spec-cache corpus
          for pair in "r5 R5" "r4 R4" "r3 STU3"; do
            set -- $pair
            mkdir -p "spec-cache/$1/fhir-definitions-json"
            curl -sSL "https://hl7.org/fhir/$2/definitions.json.zip" -o defs.zip
            unzip -qo defs.zip -d "spec-cache/$1/fhir-definitions-json"
            curl -sSL "https://hl7.org/fhir/$2/examples-json.zip" -o ex.zip
            cdir=$(echo "$1" | sed 's/r3/stu3/')
            mkdir -p "corpus/$cdir"
            unzip -qo ex.zip -d "corpus/$cdir"
          done
      # Installs the generated T-SQL on a real server and proves the append-only
      # triggers refuse writes. This is the job's whole claim today: the store is
      # not written yet (M14.28), so nothing else here touches a database.
      #
      # Note the target name: `mssql_ddl`, which is the file that exists.
      - name: Generated T-SQL installs on a live SQL Server
        env:
          FHIR_MSSQL_DDL_FULL: "1"
        run: cargo test --release -p fhir-mssql-map --test mssql_ddl -- --nocapture --test-threads=1
      - name: Round-trip and property tests + 10k proptests
        env:
          FHIR_MSSQL_SPEC_DIR: ${{ github.workspace }}/fhir-mssql/spec-cache
          FHIR_MSSQL_CORPUS_DIR: ${{ github.workspace }}/fhir-mssql/corpus
          FHIR_MSSQL_TEST_CORPUS_LIMIT: "400"
          FHIR_MSSQL_PROPTEST_CASES: "10000"
        run: |
          set -o pipefail
          cargo test --release -p fhir-mssql-gen --test proptest_roundtrip -- --nocapture
      # This step did not exist until 2026-08-12 (F-92): the job predates the
      # store (F-65) and was never revisited, so the store suite — including
      # the 12 upgrade tests F-47 added — had never run on hosted CI. TLS
      # intent lives in the DSN above (TrustServerCertificate=true, for the
      # container's self-signed certificate — the F-91 lesson, declared).
      - name: Store live suite
        env:
          FHIR_MSSQL_SPEC_DIR: ${{ github.workspace }}/fhir-mssql/spec-cache
          FHIR_MSSQL_CORPUS_DIR: ${{ github.workspace }}/fhir-mssql/corpus
        run: cargo test --release -p fhir-mssql-store -- --nocapture --test-threads=1

  # The TLS-only database job from the PostgreSQL original is removed here, not
  # ported. SQL Server is a network server and negotiates TLS during login even
  # for an otherwise plaintext connection (M14.24), so transport security does
  # apply and this job should come back. The old reason — "cannot be written
  # honestly until there is a store" — is obsolete (F-65 built one); the honest
  # gap is a server configured to *force* encryption, so the store's policy
  # around it gets exercised (M14.28). Tracked as an open task rather than
  # left as a PostgreSQL job pretending to cover this port.

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rust-version` in Cargo.toml is a promise to downstream users. Without
      # a job that builds on exactly that toolchain it is only a claim, and it
      # breaks silently the first time anyone uses a newer language feature.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "MSRV is $v"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-mssql
          key: msrv-${{ steps.msrv.outputs.version }}
      - run: cargo check --workspace --all-targets --locked

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [shred]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-mssql
          key: fuzz-${{ matrix.target }}
      # T11.9: targets that are committed but never executed prove nothing.
      #
      # `search_sql` checks a property, not just the absence of a crash:
      # every attacker-controlled search value must end up in the bind list,
      # never spliced into the SQL. That separation is what makes injection
      # impossible, and a fuzzer can check it directly. Verified by breaking
      # it — interpolating one value into the query fails the target at once.
      #
      # Both targets read a committed two-resource map, so neither needs a
      # specification download or a database.
      - run: cargo install cargo-fuzz --locked
      - name: Run ${{ matrix.target }}
        run: |
          mkdir -p /tmp/corpus/${{ matrix.target }}
          cp fuzz/seeds/${{ matrix.target }}/* /tmp/corpus/${{ matrix.target }}/ 2>/dev/null || true
          cargo +nightly fuzz run ${{ matrix.target }} /tmp/corpus/${{ matrix.target }} -- \
            -max_total_time=120 -rss_limit_mb=4096
      - name: Upload any crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fhir-mssql/fuzz/artifacts/

  published-versions:
    name: No version diverges from crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A crates.io version is immutable. If this tree carries a version that
      # is already published, the two must agree — otherwise the published
      # artifact and the source disagree while every local build stays green,
      # because a local build resolves the path dependency and never fetches
      # the registry copy. The divergence then surfaces only when someone
      # packages a dependent, as an error about code they did not touch.
      - name: Compare each published version against this tree
        run: |
          fail=0
          for crate in fhir-mssql-map fhir-mssql-gen fhir-mssql-store; do
            version=$(cargo metadata --format-version 1 --no-deps \
              | python3 -c "import json,sys;print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='$crate'))")
            url="https://static.crates.io/crates/$crate/$crate-$version.crate"
            if ! curl -sfL "$url" -o /tmp/pub.crate; then
              echo "$crate $version: unpublished, nothing to compare"
              continue
            fi
            rm -rf /tmp/pubx && mkdir -p /tmp/pubx
            tar xzf /tmp/pub.crate -C /tmp/pubx
            if diff -rq "/tmp/pubx/$crate-$version/src" "crates/$crate/src" >/dev/null 2>&1; then
              echo "$crate $version: matches crates.io"
            else
              echo "::error::$crate $version is published but differs from this tree; bump it"
              diff -rq "/tmp/pubx/$crate-$version/src" "crates/$crate/src" || true
              fail=1
            fi
          done
          exit "$fail"

  supply-chain:
    name: Advisories, licenses, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-mssql
      # A component handling clinical data is part of someone's IEC 62304
      # file (spec O10.10). This evidence is cheap to keep green continuously
      # and expensive to reconstruct after the fact.
      - name: cargo-deny (advisories, licenses, sources, bans)
        uses: EmbarkStudios/cargo-deny-action@v2
        # `uses:` steps ignore defaults.run.working-directory, so the
        # manifest must be named explicitly (found by the first hosted run:
        # the action ran at the repo root, where there is no Cargo.toml).
        with:
          command: check
          manifest-path: fhir-mssql/Cargo.toml
      - name: CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: "fhir-mssql/**/*.cdx.json"
