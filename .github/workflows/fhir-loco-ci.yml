# Consolidated from fhir-loco/.github/workflows/ci.yaml (F-49): GitHub only
# reads workflows at the repository root, so the per-family copy never ran.
#
# Rewritten rather than moved: the old file was the loco-rs template's,
# provisioning Redis and PostgreSQL services this application does not use —
# fhir-loco mounts fhir-sqlite, an embedded file, and its config mentions
# neither service. The deprecated actions-rs steps are plain `run:` steps now,
# which is also what lets `defaults.run.working-directory` apply.
name: fhir-loco CI

on:
  push:
    branches: [main]
    paths:
      - 'fhir-loco/**'
      - 'fhir-sqlite/**'
      - 'fhir-store/**'
      - '.github/workflows/fhir-loco-ci.yml'
  pull_request:
    paths:
      - 'fhir-loco/**'
      - 'fhir-sqlite/**'
      - 'fhir-store/**'
      - '.github/workflows/fhir-loco-ci.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: fhir-loco

# Every job below that builds Rust starts by removing preinstalled tooling
# this repository never uses — Android SDK/NDK, .NET, GHC, Swift — which
# otherwise leaves only ~14 GB free on a stock ubuntu-latest runner before
# anything is built. Not a hypothetical: this repository has already hit a
# hosted-runner ceiling once (see the comment above the fhir/ build matrix —
# a combined build was SIGTERM-killed at 12.9 GB peak RSS on a 7 GB runner),
# and every crate this monorepo adds makes the margin thinner, not wider.
#
jobs:
  test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (unused preinstalled runner bloat)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /opt/az "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-loco
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The request suite runs against fhir-sqlite in-process: no service
      # containers, no DSN. SV2.x endpoint behaviour, the CapabilityStatement
      # agreement test (F-57), PASETO auth, and the production-config boot
      # tests (F-59) all run here.
      - run: cargo test

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (unused preinstalled runner bloat)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /opt/az "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /
      # `rust-version` in Cargo.toml is a promise to downstream users. Without
      # a job that builds on exactly that toolchain it is only a claim, and it
      # breaks silently the first time anyone uses a newer language feature.
      # This crate declared none at all until 2026-08-29 (RV1.4 unmet, spec
      # spec/rust-msrv-n-minus-2/) — this job is what RV1.5 requires the
      # moment a value exists.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "MSRV is $v"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-loco
          key: msrv-${{ steps.msrv.outputs.version }}
      - run: cargo check --workspace --all-targets --locked

  published-versions:
    name: No version diverges from crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (unused preinstalled runner bloat)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /opt/az "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      # O10.11: a published version must match the source that claims it.
      # This crate had no such check at all until F-102 -- unlike the six
      # database ports, fhir-loco-ci.yml never carried one, so a divergence
      # here (rstest bumped in Cargo.toml without a version bump, in this
      # exact tree at the time of writing) went undetected.
      - name: Compare each published version against this tree
        run: ../scripts/check-published-match.sh --diff fhir-loco
