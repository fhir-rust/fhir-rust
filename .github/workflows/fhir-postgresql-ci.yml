name: fhir-postgresql CI

on:
  push:
    branches: [main]
    paths:
      - 'fhir-postgresql/**'
      - '.github/workflows/fhir-postgresql-ci.yml'
      - 'fhir-store/**'
  pull_request:
    paths:
      - 'fhir-postgresql/**'
      - '.github/workflows/fhir-postgresql-ci.yml'
      - 'fhir-store/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Consolidated from fhir-postgresql/.github/workflows/ (F-49): GitHub only reads
# workflows at the repository root, so the per-family copy never ran.
defaults:
  run:
    working-directory: fhir-postgresql

jobs:
  test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-postgresql
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Unit tests pass with no database and no spec packages present;
      # the corpus/spec-driven tests skip themselves when inputs are absent.
      - run: cargo test --workspace
      - name: Build the book
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          ./mdbook build book

  database:
    name: Live-database tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fhir-postgresql
          POSTGRES_PASSWORD: fhir-postgresql
          POSTGRES_DB: fhir-postgresql
          # Two settings, both about resources rather than behaviour.
          # max_locks_per_transaction: the suites install several version
          # schemas and touch thousands of relations per transaction.
          # max_parallel_maintenance_workers=0: building thousands of indexes
          # spawns parallel workers that allocate dynamic shared memory, and
          # /dev/shm in a container is small. The indexes here are all on
          # empty tables, so parallel builds buy nothing.
          POSTGRES_INITDB_ARGS: >-
            -c max_locks_per_transaction=512
            -c max_parallel_maintenance_workers=0
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fhir-postgresql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --shm-size=1g
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: fhir-postgresql
      PGPASSWORD: fhir-postgresql
      FHIR_POSTGRESQL_TEST_DB: fhir-postgresql
      # A live job that reaches no server must be red, not a green run that
      # skipped everything (F-06, F-91).
      FHIR_POSTGRESQL_REQUIRE_DB: "1"
      # Explicit, because the store's default is `require` (O10.7, F-17) and
      # this job's service speaks plaintext by design — the TLS-only job
      # below is where `require` is exercised. Without this, every live test
      # refuses the plaintext link, exactly as the default promises.
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-postgresql
      # The live tests need the FHIR definitions and an example corpus.
      - name: Fetch FHIR spec packages and example corpora
        run: |
          mkdir -p spec-cache corpus
          for pair in "r5 R5" "r4 R4" "r3 STU3"; do
            set -- $pair
            mkdir -p "spec-cache/$1/fhir-definitions-json"
            curl -sSL "https://hl7.org/fhir/$2/definitions.json.zip" -o defs.zip
            unzip -qo defs.zip -d "spec-cache/$1/fhir-definitions-json"
            curl -sSL "https://hl7.org/fhir/$2/examples-json.zip" -o ex.zip
            cdir=$(echo "$1" | sed 's/r3/stu3/')
            mkdir -p "corpus/$cdir"
            unzip -qo ex.zip -d "corpus/$cdir"
          done
      - name: Live tests (round trip, M2 semantics, search) + 10k proptests
        env:
          FHIR_POSTGRESQL_SPEC_DIR: ${{ github.workspace }}/fhir-postgresql/spec-cache
          FHIR_POSTGRESQL_CORPUS_DIR: ${{ github.workspace }}/fhir-postgresql/corpus
          FHIR_POSTGRESQL_TEST_CORPUS_LIMIT: "400"
          FHIR_POSTGRESQL_PROPTEST_CASES: "10000"
        run: |
          set -o pipefail
          cargo test --release -p fhir-postgresql-gen --test proptest_roundtrip -- --nocapture
          # One test thread: several of these install a full FHIR schema
          # (5,700-7,300 tables) and two doing so concurrently can exhaust the
          # server's lock budget, which surfaces as an unrelated-looking
          # "out of shared memory" rather than as a resource limit.
          #
          # On failure the interesting lines are echoed as ::error:: so they
          # reach the run's annotations. Job logs need repository admin to
          # download; annotations are readable by anyone who can see the run,
          # which is what makes a red build diagnosable from outside.
          if ! cargo test --release -p fhir-postgresql-store \
                 -- --nocapture --test-threads=1 2>&1 | tee live-tests.log; then
            echo "::error::live-database tests failed; extract follows"
            # -A2: the panic *message* is on the line after "panicked at",
            # and the message is the whole point.
            grep -E -A2 "^test .*(FAILED|panicked)|^---- .* ----|panicked at|assertion" \
              live-tests.log | head -40 | while IFS= read -r l; do
                echo "::error::${l}"
              done
            exit 1
          fi
      # The suite above runs unkeyed, which is the weaker configuration and
      # the one the tests tolerate. Without this step the MAC write path,
      # keyed verification, and keyed checkpoints are never executed in CI —
      # a silent gap, because the audit test is key-aware and passes either
      # way (spec M3.16b).
      # The key below is a throwaway constant, deliberately committed: it
      # protects nothing, and a workflow that pulled a real key from secrets
      # would put one in reach of every fork's pull-request runner.
      - name: The live suite must not pass by skipping (T11.12)
        run: |
          # The first hosted run was green here while every spec-dependent
          # live test self-skipped ("spec missing" — the env pointed at an
          # unrooted path). A skip on CI is indistinguishable from a pass
          # unless something looks, so something looks.
          # The bench is opt-in by design (FHIR_POSTGRESQL_BENCH=<n>); its
          # skip is a decision, not a missing input.
          if grep "skipping:" live-tests.log | grep -v "FHIR_POSTGRESQL_BENCH" | grep -q .; then
            grep "skipping:" live-tests.log | grep -v "FHIR_POSTGRESQL_BENCH" | sort -u
            echo "::error::live tests skipped on CI; the gate would be green while testing nothing"
            exit 1
          fi
      - name: Audit suite, keyed
        env:
          FHIR_POSTGRESQL_CHAIN_KEY: 4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f
          FHIR_POSTGRESQL_CHAIN_KEY_ID: ci
        run: cargo test --release -p fhir-postgresql-store --test audit -- --nocapture

  tls-database:
    name: TLS-only PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-postgresql
      # fhir-postgresql refuses a networked bind over a plaintext database link, and
      # its `require` validates the server certificate where libpq's does
      # not. Neither claim is worth anything untested against a server that
      # actually insists on TLS, which the plain `database` job does not.
      - name: Start a PostgreSQL that refuses plaintext
        run: |
          set -euo pipefail
          mkdir -p pgtls
          openssl req -new -x509 -days 1 -nodes -text \
            -out pgtls/server.crt -keyout pgtls/server.key \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          # The server reads these as its own uid; the image runs as 999.
          # `sudo podman` deliberately, not rootless: rootless would map
          # container uid 999 to a host subuid, so a host-side `chown 999`
          # would not be the uid the server runs as and the key would be
          # unreadable. Running podman as root reproduces Docker's uid
          # semantics exactly, which is what this chown assumes.
          sudo chown 999:999 pgtls/server.key pgtls/server.crt
          sudo chmod 600 pgtls/server.key
          # `hostssl` only: a plaintext TCP connection is rejected outright
          # rather than silently downgraded.
          cat > pgtls/pg_hba.conf <<'HBA'
          local all all trust
          hostssl all all all scram-sha-256
          HBA
          sudo chown 999:999 pgtls/pg_hba.conf
          sudo podman run -d --name pgtls --shm-size=1g \
            -e POSTGRES_USER=fhir-postgresql -e POSTGRES_PASSWORD=fhir-postgresql \
            -e POSTGRES_DB=fhir-postgresql \
            -v "$PWD/pgtls:/certs" -p 5432:5432 docker.io/library/postgres:18 \
            -c ssl=on -c ssl_cert_file=/certs/server.crt \
            -c ssl_key_file=/certs/server.key \
            -c hba_file=/certs/pg_hba.conf
          for _ in $(seq 1 40); do
            if sudo podman exec pgtls pg_isready -U fhir-postgresql >/dev/null 2>&1; then break; fi
            sleep 1
          done
          sudo podman exec pgtls pg_isready -U fhir-postgresql
      - name: Plaintext must be refused
        env:
          PGHOST: localhost
          PGUSER: fhir-postgresql
          PGPASSWORD: fhir-postgresql
        run: |
          if PGSSLMODE=disable psql -d fhir-postgresql -c 'select 1' 2>/dev/null; then
            echo "::error::server accepted a plaintext connection; the TLS gate proves nothing"
            exit 1
          fi
          echo "plaintext refused, as intended"
      - name: Fetch FHIR definitions
        run: |
          mkdir -p spec-cache/r5/fhir-definitions-json
          curl -sSL "https://hl7.org/fhir/R5/definitions.json.zip" -o defs.zip
          unzip -qo defs.zip -d spec-cache/r5/fhir-definitions-json
      - name: Live tests over TLS
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: fhir-postgresql
          PGPASSWORD: fhir-postgresql
          PGSSLMODE: require
          # Self-signed, so the server certificate is its own trust anchor.
          PGSSLROOTCERT: ${{ github.workspace }}/pgtls/server.crt
          FHIR_POSTGRESQL_TEST_DB: fhir-postgresql
          FHIR_POSTGRESQL_REQUIRE_DB: "1"
      # A live job that reaches no server must be red, not a green run that
      # skipped everything (F-06, F-91).
      FHIR_POSTGRESQL_REQUIRE_DB: "1"
          FHIR_POSTGRESQL_SPEC_DIR: ${{ github.workspace }}/fhir-postgresql/spec-cache
        run: cargo test -p fhir-postgresql-store --test live -- --nocapture

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rust-version` in Cargo.toml is a promise to downstream users. Without
      # a job that builds on exactly that toolchain it is only a claim, and it
      # breaks silently the first time anyone uses a newer language feature.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "MSRV is $v"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-postgresql
          key: msrv-${{ steps.msrv.outputs.version }}
      - run: cargo check --workspace --all-targets --locked

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [search_sql, shred]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-postgresql
          key: fuzz-${{ matrix.target }}
      # T11.9: targets that are committed but never executed prove nothing.
      #
      # `search_sql` checks a property, not just the absence of a crash:
      # every attacker-controlled search value must end up in the bind list,
      # never spliced into the SQL. That separation is what makes injection
      # impossible, and a fuzzer can check it directly. Verified by breaking
      # it — interpolating one value into the query fails the target at once.
      #
      # Both targets read a committed two-resource map, so neither needs a
      # specification download or a database.
      - run: cargo install cargo-fuzz --locked
      - name: Run ${{ matrix.target }}
        run: |
          mkdir -p /tmp/corpus/${{ matrix.target }}
          cp fuzz/seeds/${{ matrix.target }}/* /tmp/corpus/${{ matrix.target }}/ 2>/dev/null || true
          cargo +nightly fuzz run ${{ matrix.target }} /tmp/corpus/${{ matrix.target }} -- \
            -max_total_time=120 -rss_limit_mb=4096
      - name: Upload any crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fhir-postgresql/fuzz/artifacts/

  published-versions:
    name: No version diverges from crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A crates.io version is immutable. If this tree carries a version that
      # is already published, the two must agree — otherwise the published
      # artifact and the source disagree while every local build stays green,
      # because a local build resolves the path dependency and never fetches
      # the registry copy. The divergence then surfaces only when someone
      # packages a dependent, as an error about code they did not touch.
      - name: Compare each published version against this tree
        run: |
          fail=0
          for crate in fhir-postgresql-map fhir-postgresql-gen fhir-postgresql-store; do
            version=$(cargo metadata --format-version 1 --no-deps \
              | python3 -c "import json,sys;print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='$crate'))")
            url="https://static.crates.io/crates/$crate/$crate-$version.crate"
            if ! curl -sfL "$url" -o /tmp/pub.crate; then
              echo "$crate $version: unpublished, nothing to compare"
              continue
            fi
            rm -rf /tmp/pubx && mkdir -p /tmp/pubx
            tar xzf /tmp/pub.crate -C /tmp/pubx
            if diff -rq "/tmp/pubx/$crate-$version/src" "crates/$crate/src" >/dev/null 2>&1; then
              echo "$crate $version: matches crates.io"
            else
              echo "::error::$crate $version is published but differs from this tree; bump it"
              diff -rq "/tmp/pubx/$crate-$version/src" "crates/$crate/src" || true
              fail=1
            fi
          done
          exit "$fail"

  supply-chain:
    name: Advisories, licenses, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fhir-postgresql
      # A component handling clinical data is part of someone's IEC 62304
      # file (spec O10.10). This evidence is cheap to keep green continuously
      # and expensive to reconstruct after the fact.
      - name: cargo-deny (advisories, licenses, sources, bans)
        uses: EmbarkStudios/cargo-deny-action@v2
        # `uses:` steps ignore defaults.run.working-directory, so the
        # manifest must be named explicitly (found by the first hosted run:
        # the action ran at the repo root, where there is no Cargo.toml).
        with:
          command: check
          manifest-path: fhir-postgresql/Cargo.toml
      - name: CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "fhir-postgresql/**/*.cdx.json"
