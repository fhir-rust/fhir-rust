# Dependabot configuration. Alerts and automated security fixes are
# repository settings, enabled 2026-08-26 alongside private vulnerability
# reporting and secret scanning; this file registers every lockfile so those
# have full coverage.
#
# One cargo entry per workspace: this monorepo is nine separate Cargo
# workspaces (see AGENTS.md), and dependabot scopes cargo to a directory's
# own lockfile.
#
# Scheduled version-update PRs were off (`open-pull-requests-limit: 0`)
# from when this file was created until 2026-08-29 — the first hour with
# default limits opened 47 PRs, many of them major bumps (syn 3, reqwest
# 0.13, rusqlite 0.40), each triggering a port's full live-database CI, and
# this repository upgrades deliberately, with verification, under an MSRV
# floor (rust-msrv-n-minus-2). Re-enabled per spec/dependabot/ (owner
# decision): each ecosystem now uses GitHub's default cap (5 open PRs) per
# directory rather than an explicit override, so a flood is bounded per
# workspace even with nine of them. Security-advisory PRs were never
# affected by the limit either way (automated security fixes are enabled
# repository-side, independent of `open-pull-requests-limit`), and
# `fhir-security.yml` remains the gate that actually fails the build on a
# known advisory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # `dtolnay/rust-toolchain@1.96.0` in fhir-ci.yml's msrv job is not an
      # action-revision pin -- that ref IS the Rust toolchain version the
      # action installs. Dependabot's github-actions updater doesn't know
      # that distinction and walks it like any other tag: PR #19 ("bump
      # dtolnay/rust-toolchain from 1.88.0 to 1.100.0", closed without
      # merging) would have pinned a Rust version that does not exist.
      # This pin moves by hand, in the same change that recomputes the MSRV
      # under spec/rust-msrv-n-minus-2/ -- never as an automated bump.
      # Reported by a peer session working on snomed-rust, which hit the
      # same shape live: RUSTSEC-class exposure without a matching filed
      # advisory, but confirmed here against this repo's own PR #19 before
      # acting on it, not assumed from the report alone.
      - dependency-name: "dtolnay/rust-toolchain"
  - package-ecosystem: cargo
    directory: /fhir
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: cargo
    directory: /fhir-store
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: cargo
    directory: /fhir-loco
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: cargo
    directory: /fhir-postgresql
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: cargo
    directory: /fhir-sqlite
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: cargo
    directory: /fhir-mysql
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: cargo
    directory: /fhir-mariadb
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: cargo
    directory: /fhir-mssql
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: cargo
    directory: /fhir-oracle
    schedule:
      interval: weekly
      day: monday
