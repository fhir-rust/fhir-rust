<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- The Lily theme stylesheet. ThemePicker takes this link over on mount
		     (it looks for data-lily-theme-picker) and swaps its href. -->
		<link rel="stylesheet" href="/themes/light.css" data-lily-theme-picker="theme" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
